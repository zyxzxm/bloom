name: Build BLOOM APK and EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'web/**'
      - 'bloom_app/**'
      - 'bloom_safe/**'
      - 'bloom_maker/**'
      - 'build_windows.ps1'
      - 'requirements-client.txt'
      - '.github/workflows/build-binaries.yml'

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build installable debug APK
        run: ./android/gradlew --no-daemon -p android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BLOOM-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build BLOOM.exe
        shell: pwsh
        env:
          BLOOM_API_URL: https://bloom-world.onrender.com
        run: ./build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: BLOOM-Windows-EXE
          path: release/BLOOM.exe
          if-no-files-found: error
          retention-days: 14
