plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zyx.bloom'
    compileSdk 35

    defaultConfig {
        applicationId 'com.zyx.bloom'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
}

def webSource = new File(rootProject.projectDir.parentFile, 'web')
def webAssets = file('src/main/assets')
tasks.register('syncWebAssets', Sync) {
    from(webSource)
    into(webAssets)
}
tasks.named('preBuild').configure {
    dependsOn tasks.named('syncWebAssets')
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
